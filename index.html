<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regulated stock families — how a child's catch reaches the parent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#FBFAF7; --ink:#13324F; --ink-soft:#4E5F72; --rule:#D9D5CC;
    --parent:#0F6E56; --parent-fill:#E1F5EE; --parent-ink:#085041;
    --stone:#8A8781; --stone-fill:#F1EFE8; --stone-ink:#444441;
    --area:#BA7517; --area-fill:#FAEEDA; --area-ink:#633806;
    --flow:#C4442A; --moved:#C4442A;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif; font-feature-settings:"tnum" 1; }
  body { display:grid; grid-template-rows:auto 1fr auto; min-height:100vh; }
  header { padding:1.5rem 2.5rem 0; }
  h1 { margin:0; font-size:1.5rem; font-weight:500; letter-spacing:-.01em; }
  .sub { color:var(--ink-soft); font-size:1rem; }
  main { padding:1rem 2.5rem; display:grid; grid-template-columns:minmax(0,1fr) 20rem; gap:2.5rem; align-items:start; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .stage svg { width:100%; height:auto; max-height:72vh; display:block; }
  .aside { font-size:1.05rem; line-height:1.55; padding-top:.5rem; overflow-wrap:anywhere; }
  .aside h2 { font-size:1.1rem; font-weight:500; margin:0 0 .5rem; }
  .aside p { margin:0 0 .75rem; }
  .ledger { display:flex; flex-direction:column; gap:.4rem; margin:.75rem 0 1.25rem; padding:.75rem 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
  .ledger .row { display:flex; justify-content:space-between; gap:1rem; color:var(--ink-soft); }
  .ledger .row.in { color:var(--ink); }
  .ledger .row.tot { font-weight:500; color:var(--ink); padding-top:.35rem; border-top:1px solid var(--rule); }
  .num { font-variant-numeric:tabular-nums; white-space:nowrap; }
  footer { padding:.75rem 2.5rem 1rem; display:flex; gap:2.5rem; align-items:center; flex-wrap:wrap; position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--rule); z-index:2; }
  .seg { display:inline-flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; }
  .seg button, .btn { appearance:none; border:0; background:transparent; color:var(--ink-soft); font:inherit; font-size:.95rem; padding:.55rem 1rem; cursor:pointer; }
  .btn { border:1px solid var(--ink); border-radius:8px; color:var(--ink); }
  .btn:disabled { opacity:.4; cursor:default; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .seg button:focus-visible, .btn:focus-visible { outline:2px solid var(--parent); outline-offset:-2px; }
  .lbl { font-size:.85rem; color:var(--ink-soft); margin-right:.5rem; }
  .tabs { display:flex; gap:.25rem; border:1px solid var(--rule); border-radius:8px; padding:.2rem; }
  .tabs button { appearance:none; border:0; background:transparent; color:var(--ink-soft); font:inherit; font-size:.9rem; padding:.4rem .8rem; border-radius:6px; cursor:pointer; }
  .tabs button[aria-current="page"] { background:var(--ink); color:var(--paper); }
  .tabs button:hover { color:var(--ink); }
  .tabs button:focus-visible { outline:2px solid var(--parent); outline-offset:2px; }
  .hint { margin-left:auto; font-size:.85rem; color:var(--ink-soft); }
  .flowline { stroke:var(--flow); stroke-width:2; fill:none; stroke-dasharray:6 6; opacity:0; transition:opacity .3s; }
  .pending { opacity:.35; }
  .cover-lbl { opacity:0; transition:opacity .5s; }
  .cover-lbl.on { opacity:1; }
  #famSeg, #snapSeg { }
  body[data-view="cover"] #famBlock, body[data-view="cover"] #snapBlock, body[data-view="cover"] #reset { display:none; }
  body[data-view="map"] #snapBlock, body[data-view="map"] #reset { display:none; }
  body[data-view="species"] #snapBlock, body[data-view="species"] #reset, body[data-view="species"] #play { display:none; }
  #exBlock { display:none; } body[data-view="explorer"] #exBlock { display:block; }
  body[data-view="explorer"] #famBlock, body[data-view="explorer"] #snapBlock, body[data-view="explorer"] #reset, body[data-view="explorer"] #play { display:none; }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:2rem;flex-wrap:wrap">
    <div><h1>Regulated stock families</h1><div class="sub" id="subtitle"></div></div>
    <nav class="tabs" id="tabs" aria-label="Slides"></nav>
  </div>
</header>

<main>
  <div class="stage"><svg id="tree" viewBox="0 0 680 520" role="img" aria-labelledby="tt td"><title id="tt"></title><desc id="td"></desc></svg></div>
  <aside class="aside">
    <h2 id="ah"></h2>
    <p id="ap"></p>
    <div class="ledger" id="ledger"></div>
    <p class="sub" id="note"></p>
  </aside>
</main>

<footer>
  <div id="famBlock"><span class="lbl">Family</span><span class="seg" id="famSeg"></span></div>
  <div id="snapBlock"><span class="lbl">Snapshot</span><span class="seg" id="snapSeg"></span></div>
  <button class="btn" id="play" type="button">Play</button>
  <button class="btn" id="reset" type="button">Reset</button>
  <div id="exBlock"><span class="lbl">Stock area</span><input id="exInput" list="exList" class="btn" style="width:11rem" value="2AC4-C" spellcheck="false"><datalist id="exList"></datalist></div>
  <div class="hint" id="hint">space play · enter next</div>
</footer>

<script src="data/land.js"></script>
<script src="data/outlines.js"></script>
<script src="data/stock_geo.js"></script>
<script src="data/species.js"></script>
<script>
const SNAPS = [
  { id:'feb', label:'12 Feb 2026', short:'12-02-2026' },
  { id:'aug', label:'13 Aug 2026', short:'13-08-2026' }
];

const FAMILIES = [
  {
    id:'srx', country:'NLD', year:2025, name:'SRX / 2AC4-C', fleet:null,
    intro:'Skates and rays in the North Sea. A parent with four children; one of them carries a child of its own.',
    root:{ name:'SRX / 2AC4-C', quota:654.400, own:{feb:0.056, aug:0.020}, children:[
      { name:'RJC / 2AC4-C', quota:0, own:{feb:385.788, aug:356.805} },
      { name:'RJH / 04-C.',  quota:0, own:{feb:144.252, aug:140.738} },
      { name:'RJM / 2AC4-C', quota:0, own:{feb:79.252,  aug:78.569} },
      { name:'SRX / *07D2.', quota:72.400, own:{feb:0, aug:0}, area:true, children:[ { name:'RJC / *07D2.', quota:0, own:{feb:62.400, aug:71.800}, area:true } ] }
    ]}
  },
  {
    id:'lin', country:'FRA', year:2025, name:'LIN / 6X14.', fleet:null,
    intro:'Ling west of Scotland and beyond. The simplest shape: one parent, one child.',
    root:{ name:'LIN / 6X14.', quota:3286.040, own:{feb:397.731, aug:398.843}, children:[ { name:'LIN / *04-C.', quota:1342.676, own:{feb:763.001, aug:789.002}, area:true } ] }
  }
];

const total_snap = n => own(n) + (n.children||[]).reduce((a,c)=>a+total_snap(c),0);
const fleetText = f => f.fleet ? `${f.fleet} vessels` : 'several vessels';
const fmt = n => n.toLocaleString('en-GB',{minimumFractionDigits:3, maximumFractionDigits:3});
let snap = 1;
const S = () => SNAPS[snap].id;
const own = n => n.own[S()];
const total = n => own(n) + (n.children||[]).reduce((a,c)=>a+total(c),0);
const ownAt = (n,i) => n.own[SNAPS[i].id];
const totalAt = (n,i) => ownAt(n,i) + (n.children||[]).reduce((a,c)=>a+totalAt(c,i),0);
const hasPrev = () => snap > 0;
const dTotal = n => hasPrev() ? totalAt(n,snap) - totalAt(n,snap-1) : 0;
const dOwn = n => hasPrev() ? ownAt(n,snap) - ownAt(n,snap-1) : 0;
const moved = v => Math.abs(v) >= 0.0005;
const sgn = v => (v>=0?'+':'−') + fmt(Math.abs(v));
const prevLabel = () => hasPrev() ? SNAPS[snap-1].label.replace(/ \d{4}$/,'') : '';
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const idOf = n => n.name.replace(/[^A-Za-z0-9]/g,'_');
const C = {
  parent:{fill:'var(--parent-fill)',stroke:'var(--parent)',ink:'var(--parent-ink)',soft:'var(--parent)'},
  stone: {fill:'var(--stone-fill)', stroke:'var(--stone)', ink:'var(--stone-ink)', soft:'var(--stone)'},
  area:  {fill:'var(--area-fill)',  stroke:'var(--area)',  ink:'var(--area-ink)',  soft:'var(--area)'}
};

let fam = 0, timers = [], playing = false;

function layout(node, depth=0, parent=null){
  node.depth = depth; node.parent = parent; node.kids = node.children||[];
  node.kids.forEach(k=>layout(k, depth+1, node));
  const leafW = 130, gap = 12;
  if (node.kids.length===0){ node.w = leafW; node.h = ('quota' in node) ? 92 : 56; }
  else { node.h = 68 + node.kids.length*20 + 20 + (depth===0?18:0) + (('quota' in node)?40:0);
         node.w = Math.max(depth===0?420:300, node.kids.reduce((a,k)=>a+k.w,0) + gap*(node.kids.length-1)); }
  node.subW = Math.max(node.w, node.kids.length ? node.kids.reduce((a,k)=>a+k.subW,0) + gap*(node.kids.length-1) : 0);
  return node;
}
function place(node, x, y){
  node.x = x + (node.subW - node.w)/2; node.y = y;
  const gap = 12, yy = y + node.h + 48;
  const kidsW = node.kids.reduce((a,k)=>a+k.subW,0) + gap*Math.max(0,node.kids.length-1);
  let cx = x + (node.subW - kidsW)/2;
  node.kids.forEach(k=>{ place(k, cx, yy); cx += k.subW + gap; });
}
function maxY(n){ return Math.max(n.y+n.h+(n.kids.length?0:18), ...n.kids.map(maxY)); }

let ROOT = null;

function render(built){
  timers.forEach(clearTimeout); timers = []; playing = false;
  const f = FAMILIES[fam];
  const root = ROOT = layout(structuredClone(f.root));
  const W = Math.max(680, root.subW + 80);
  place(root, 40 + (W-80-root.subW)/2, 40);
  const svg = document.getElementById('tree');
  svg.setAttribute('viewBox', `0 0 ${W} ${maxY(root)+40}`);
  document.getElementById('tt').textContent = `${f.country} ${f.year} ${f.name}, snapshot ${SNAPS[snap].short}`;
  document.getElementById('td').textContent = `Parent total ${fmt(total(root))} tonnes, built from its children plus what it fished directly.`;

  const parts = [];
  const line = (x1,y1,x2,y2)=>parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--stone)" stroke-width="0.75"/>`);
  const walk = (n) => {
    const isRoot = n.depth===0, pal = isRoot ? C.parent : (n.area ? C.area : C.stone);
    const cx = n.x + n.w/2, id = idOf(n);
    const mv = built && !isRoot && moved(dTotal(n));
    parts.push(`<rect data-node="${id}" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8" fill="${pal.fill}" stroke="${mv?'var(--moved)':pal.stroke}" stroke-width="${mv?2:0.75}"/>`);
    if (n.kids.length===0){
      parts.push(`<text x="${cx}" y="${n.y+18}" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="${pal.ink}">${n.name}</text>`);
      parts.push(`<text class="num" x="${cx}" y="${n.y+38}" text-anchor="middle" dominant-baseline="central" font-size="12" fill="${pal.ink}">${fmt(own(n))} t</text>`);
      if ('quota' in n){
        parts.push(`<line x1="${n.x+10}" y1="${n.y+50}" x2="${n.x+n.w-10}" y2="${n.y+50}" stroke="${pal.stroke}" stroke-width="0.5" opacity="0.6"/>`);
        parts.push(`<text x="${n.x+10}" y="${n.y+62}" dominant-baseline="central" font-size="10" fill="${pal.soft}">Quota</text><text class="num" x="${n.x+n.w-10}" y="${n.y+62}" text-anchor="end" dominant-baseline="central" font-size="10" fill="${pal.ink}">${fmt(n.quota)}</text>`);
        parts.push(`<text x="${n.x+10}" y="${n.y+78}" dominant-baseline="central" font-size="10" fill="${pal.soft}">Uptake</text><text class="num" x="${n.x+n.w-10}" y="${n.y+78}" text-anchor="end" dominant-baseline="central" font-size="11" font-weight="500" fill="${n.quota ? (own(n)/n.quota>1?'var(--moved)':pal.ink) : pal.soft}">${n.quota ? (own(n)/n.quota*100).toFixed(2)+' %' : 'N/A'}</text>`);
      }
      if (mv) parts.push(`<text class="num" x="${cx}" y="${n.y+n.h+12}" text-anchor="middle" dominant-baseline="central" font-size="11" fill="var(--moved)">${sgn(dOwn(n))} vs ${prevLabel()}</text>`);
    } else {
      let y = n.y + 22;
      parts.push(`<text x="${cx}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="${pal.ink}">${n.name}${isRoot?' — parent':''}</text>`);
      if (isRoot){ y += 18; parts.push(`<text x="${cx}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="12" fill="${pal.soft}">${f.country} ${f.year} · snapshot ${SNAPS[snap].short} · tonnes</text>`); }
      const lx = n.x + 20, rx = n.x + n.w - (built && hasPrev() ? 78 : 20);
      y += 24;
      n.kids.forEach(k=>{
        const pend = !built;
        parts.push(`<text class="${pend?'pending':''}" data-lbl="${idOf(k)}" x="${lx}" y="${y}" dominant-baseline="central" font-size="12" fill="${pal.soft}">from ${k.name}${k.kids.length?' and below':''}</text>`);
        parts.push(`<text class="num" data-node="${id}" data-row="${idOf(k)}" x="${rx}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="12" fill="${pal.ink}">${pend?'—':fmt(total(k))}</text>`);
        if (built && moved(dTotal(k))) parts.push(`<text class="num" x="${rx+8}" y="${y}" dominant-baseline="central" font-size="11" fill="var(--moved)">${sgn(dTotal(k))}</text>`);
        y += 20;
      });
      parts.push(`<text x="${lx}" y="${y}" dominant-baseline="central" font-size="12" fill="${pal.soft}">${isRoot?'fished directly on this quota':'fished directly here'}</text>`);
      parts.push(`<text class="num" x="${rx}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="12" fill="${pal.ink}">${fmt(own(n))}</text>`);
      if (built && moved(dOwn(n))) parts.push(`<text class="num" x="${rx+8}" y="${y}" dominant-baseline="central" font-size="11" fill="var(--moved)">${sgn(dOwn(n))}</text>`);
      y += 20;
      parts.push(`<line x1="${lx}" y1="${y-6}" x2="${rx}" y2="${y-6}" stroke="${pal.stroke}" stroke-width="0.75"/>`);
      y += 8;
      parts.push(`<text x="${lx}" y="${y}" dominant-baseline="central" font-size="14" font-weight="500" fill="${pal.ink}">Total catches</text>`);
      parts.push(`<text class="num" data-node="${id}" data-k="total" x="${rx}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="14" font-weight="500" fill="${pal.ink}">${fmt(!built ? own(n) : total(n))}</text>`);
      if (built && moved(dTotal(n))) parts.push(`<text class="num" x="${rx+8}" y="${y}" dominant-baseline="central" font-size="12" font-weight="500" fill="var(--moved)">${sgn(dTotal(n))}</text>`);
      if ('quota' in n){
        y += 22;
        parts.push(`<text x="${lx}" y="${y}" dominant-baseline="central" font-size="12" fill="${pal.soft}">Quota</text>`);
        parts.push(`<text class="num" x="${rx}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="12" fill="${pal.ink}">${fmt(n.quota)}</text>`);
        y += 18;
        const up = n.quota ? (built ? total(n) : own(n)) / n.quota : null;
        parts.push(`<text x="${lx}" y="${y}" dominant-baseline="central" font-size="12" fill="${pal.soft}">Uptake</text>`);
        parts.push(`<text class="num" data-node="${id}" data-k="uptake" x="${rx}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="13" font-weight="500" fill="${up===null?pal.soft:(up>1?'var(--moved)':pal.ink)}">${up===null?'N/A':(up*100).toFixed(2)+' %'}</text>`);
      }
      const by = n.y + n.h, ky = by + 44;
      line(cx, by, cx, by+22);
      if (n.kids.length>1){ const xs = n.kids.map(k=>k.x+k.w/2); line(Math.min(...xs), by+22, Math.max(...xs), by+22); }
      n.kids.forEach(k=>{ const kx = k.x+k.w/2; line(kx, by+22, kx, ky); k.path = `M ${kx} ${k.y} L ${kx} ${by+22} L ${cx} ${by+22} L ${cx} ${by}`; walk(k); });
    }
  };
  walk(root);
  svg.innerHTML = svg.querySelector('title').outerHTML + svg.querySelector('desc').outerHTML + parts.join('') + '<g id="flows"></g>';

  document.getElementById('subtitle').textContent = `${f.country} · ${f.year} · ${f.name} · snapshot ${SNAPS[snap].short}`;
  document.getElementById('ah').textContent = built ? 'The parent, complete' : 'Before the children report';
  const mvKids = root.kids.filter(k=>moved(dTotal(k))).map(k=>k.name);
  document.getElementById('ap').textContent = built
    ? `The parent now holds ${fmt(total(root))} tonnes.` + (hasPrev() ? (mvKids.length ? ` Since ${SNAPS[snap-1].label}: ${sgn(dTotal(root))} on the family, coming from ${mvKids.join(', ')}${moved(dOwn(root))?' and the parent\'s own catches':''}. Outlined boxes are the ones that moved.` : ` Nothing has moved since ${SNAPS[snap-1].label}.`) : ` This is the first snapshot; there is nothing earlier to compare with.`)
    : `${f.intro} On its own, the parent has fished ${fmt(own(root))} tonnes. Everything else it will hold comes up from the children below.`;
  ledger(root, built ? root.kids.length : 0);
  document.getElementById('note').textContent = built && hasPrev()
    ? 'Red outline and red figures: different from the previous snapshot. Everything else is unchanged.'
    : 'A catch declared against a child is counted against the parent as well — once. The parent total is the sum of its children plus what it fished directly.';
  document.querySelectorAll('#famSeg button').forEach((b,i)=>b.setAttribute('aria-pressed', i===fam));
  document.querySelectorAll('#snapSeg button').forEach((b,i)=>b.setAttribute('aria-pressed', i===snap));
  document.getElementById('play').disabled = built;
}

function ledger(root, arrived){
  const rows = [`<div class="row in"><span>fished directly on the parent</span><span class="num">${fmt(own(root))}</span></div>`];
  root.kids.forEach((k,i)=>rows.push(`<div class="row${i<arrived?' in':''}"><span>${k.name}${k.kids.length?' and below':''}</span><span class="num">${i<arrived?'+'+fmt(total(k)):'waiting'}</span></div>`));
  const sum = own(root) + root.kids.slice(0,arrived).reduce((a,k)=>a+total(k),0);
  rows.push(`<div class="row tot"><span>Parent total so far</span><span class="num">${fmt(sum)}</span></div>`);
  document.getElementById('ledger').innerHTML = rows.join('');
}

function tweenTo(sel, from, to, dur){
  const el = document.querySelector(sel); if (!el) return;
  if (reduced()) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => { const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent = fmt(from+(to-from)*e); if(p<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function play(){
  if (playing) return;
  render(false); playing = true;
  document.getElementById('play').disabled = true;
  const root = ROOT, flows = document.getElementById('flows');
  const legDur = 1700, settle = 600, pause = 700;
  let t = 600, arrived = 0;
  const running = new Map();
  const dot = (child, parent, at) => {
    const v = total(child), path = child.path, cid = idOf(child), pid = idOf(parent);
    if (!running.has(pid)) running.set(pid, own(parent));
    timers.push(setTimeout(()=>{
      document.getElementById('ah').textContent = `${child.name} reports`;
      document.getElementById('ap').textContent = `${fmt(v)} tonnes caught under ${child.name}${child.kids.length?' and its children':''} travel up and are added to ${parent.name}.`;
      const g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.innerHTML = `<path class="flowline" d="${path}"/>
        <circle r="9" fill="var(--flow)"><animateMotion dur="${legDur}ms" begin="indefinite" fill="freeze" path="${path}"/></circle>
        <text font-size="13" font-weight="500" fill="var(--flow)" text-anchor="middle" dy="-15"><animateMotion dur="${legDur}ms" begin="indefinite" fill="freeze" path="${path}"/>${fmt(v)} t</text>`;
      flows.appendChild(g);
      const finish = () => {
        g.remove();
        const lbl = document.querySelector(`[data-lbl="${cid}"]`); if (lbl) lbl.classList.remove('pending');
        tweenTo(`[data-node="${pid}"][data-row="${cid}"]`, 0, v, settle);
        const r = running.get(pid); tweenTo(`[data-node="${pid}"][data-k="total"]`, r, r + v, settle); running.set(pid, r + v);
        const upEl = document.querySelector(`[data-node="${pid}"][data-k="uptake"]`); if (upEl && parent.quota){ const q = parent.quota, u0 = r/q, u1 = (r+v)/q, t0 = performance.now(); const st = now => { const pp = Math.min(1,(now-t0)/settle); const u = u0+(u1-u0)*pp; upEl.textContent = (u*100).toFixed(2)+' %'; upEl.setAttribute('fill', u>1?'var(--moved)':''); if (pp<1) requestAnimationFrame(st); }; requestAnimationFrame(st); }
        if (parent === root){ arrived += 1; ledger(root, arrived); }
      };
      g.querySelector('.flowline').style.opacity = 1;
      if (reduced()){ finish(); return; }
      g.querySelectorAll('animateMotion').forEach(a=>a.beginElement());
      timers.push(setTimeout(finish, legDur));
    }, at));
    return at + legDur + settle + pause;
  };
  const build = (n) => { n.kids.forEach(k=>{ build(k); t = dot(k, n, t); }); };
  build(root);
  timers.push(setTimeout(()=>render(true), t));
}


// ===================== SPECIES: original drawings =====================
// SPECIES: loaded from data/species.js
const speciesOf = name => name.split(' / ')[0];
// licensed photographs for the species cards (drawings stay in use on the map and voyage)

function playBoarding(){
  if (playing) return; playing = true;
  document.getElementById('play').disabled = true;
  const walkDur = 2400, gap = 350;
  let t = 300;
  const go = (c, at, follower) => {
    timers.push(setTimeout(()=>{
      const w = document.getElementById(`walk-${c.key}`); w.style.opacity = 1;
      const am = document.getElementById(`am-${c.key}`);
      if (reduced()){ arrive(c); return; }
      am.beginElement();
      if (follower){
        const fw = document.getElementById(`walk-${follower.key}`); fw.style.opacity = 1;
        const fam = document.getElementById(`am-${follower.key}`); fam.beginElement();
      }
      timers.push(setTimeout(()=>{ arrive(c); if (follower) arrive(follower); }, walkDur));
    }, at));
  };
  const arrive = (c) => {
    const w = document.getElementById(`walk-${c.key}`); if (w) w.style.opacity = 0;
    const f = document.getElementById(`fig-${c.key}`); if (f){ f.style.opacity = 1; f.querySelectorAll('.cover-lbl').forEach(x=>x.classList.add('on')); }
    document.getElementById('ah').textContent = c.small ? 'the grandchild comes too' : `${c.label} boards`;
  };
  CREW.filter(c=>!c.rides).forEach(c=>{
    const follower = CREW.find(x=>x.rides===c.key);
    go(c, t, follower);
    t += walkDur + gap;
  });
  timers.push(setTimeout(()=>{
    playing = false;
    document.getElementById('ah').textContent = 'All aboard';
    document.getElementById('ap').textContent = 'Six on one vessel: the parent, four children, one grandchild. The next slides show the same family as a tree of quotas, and how each catch climbs from child to parent.';
    document.getElementById('note').textContent = 'Enter for the families.';
  }, t + 200));
}

function renderSpecies(){
  timers.forEach(clearTimeout); timers = []; playing = false;

  const members = []; const walkM = (n, depth) => { members.push({name:n.name, sp:speciesOf(n.name), code:n.name.split(' / ')[1], depth}); (n.children||[]).forEach(k=>walkM(k, depth+1)); };
  walkM(f.root, 0);
  const seen = new Set(); const uniq = members.filter(m=>{ if (seen.has(m.sp)) return false; seen.add(m.sp); return true; });
  const cols = Math.min(uniq.length, 3), rows = Math.ceil(uniq.length/cols), CW = 220, CH = 250;
  const W = cols*CW + 40, H = rows*CH + 40;

  const cards = uniq.map((m,i)=>{ const sp = SPECIES[m.sp], g = GEN[Math.min(m.depth,2)], x = 20 + (i%cols)*CW, y = 20 + Math.floor(i/cols)*CH;

      <text x="${(CW-16)/2}" y="${CH-48}" text-anchor="middle" font-size="11" font-style="italic" fill="var(--ink-soft)">${sp?sp.latin:''}</text>
      <text x="${(CW-16)/2}" y="${CH-30}" text-anchor="middle" font-size="11" fill="${g.stroke}">${m.sp}</text>
    </g>`; }).join('');
  svg.innerHTML = svg.querySelector('title').outerHTML + svg.querySelector('desc').outerHTML + cards;
  document.getElementById('subtitle').textContent = `${f.country} · ${f.year} · ${f.name}`;

    ? 'The parent quota is for skates and rays as a group. Three of its children are single species — thornback, blonde and spotted ray — fished in the same water; the fourth is the group again, in the Channel.'
    : 'One species throughout: ling. The parent covers the western waters; the child is the same fish, allowed into the North Sea.';
  document.getElementById('ledger').innerHTML = uniq.map(m=>{ const sp = SPECIES[m.sp]; return `<div class="row in" style="display:block"><span style="font-weight:500">${sp?sp.name:m.sp}</span> <span style="font-size:.85rem;color:var(--ink-soft)">${sp?sp.text:''}</span></div>`; }).join('');
  const credits = uniq.filter(m=>SPECIES_PHOTO[m.sp]).map(m=>SPECIES_PHOTO[m.sp].credit);
  document.getElementById('note').textContent = (credits.length ? credits.join(' · ') + ' · ' : '') + 'Other species are original drawings for this presentation.';

function fishAt(sp, x, y, scale, uid, title, gen){
  const d = SPECIES[sp]; if (!d) return '';
  const tip = title ? `<title>${title}</title>` : '';
  const ph = SPECIES_PHOTO[sp];
  if (ph){ const r = 44*scale/0.46, col = gen ? GEN[gen].stroke : 'var(--parent)';
    if (ph.wide){ const w = r*2.6, h = r*0.7;
      return `<g transform="translate(${x},${y}) rotate(-6)" style="cursor:help">${tip}<image href="${ph.url}" x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid meet" style="mix-blend-mode:multiply" opacity="0.9"/></g>`; }
    return `<g transform="translate(${x},${y})" style="cursor:help">${tip}<clipPath id="pc_${uid}"><circle r="${r}"/></clipPath><circle r="${r+2}" fill="var(--paper)" stroke="${col}" stroke-width="1.5"/><image href="${ph.url}" x="${-r*1.3}" y="${-r*1.3}" width="${r*2.6}" height="${r*2.6}" preserveAspectRatio="xMidYMid slice" clip-path="url(#pc_${uid})"/></g>`; }
  const svgIn = d.svg.replace(/id="(g_|c_)(\w+)"/g, `id="$1$2_${uid}"`).replace(/url\(#(g_|c_)(\w+)\)/g, `url(#$1$2_${uid})`)
    .replace('translate(110,95) scale(0.62)', 'translate(0,0) scale(0.62)').replace('translate(110,92) scale(0.78)', 'translate(0,0) scale(0.78)');
  return `<g transform="translate(${x},${y}) scale(${scale})" style="cursor:help">${tip}${svgIn}</g>`;
}

      timers.push(setTimeout(()=>{
        document.getElementById('ah').textContent = '';
        document.getElementById('ap').textContent = '';
        playing = false;
      }, t)); continue;
    }
    // fishing at this stop: each species in turn, the boat does not move
    (st.catches||[]).forEach((c, ci)=>{
      const tonnes = c.t ?? findOwn(c.member), sp = speciesOf(c.member), hasFish = !!SPECIES[sp];
      const cardY = to[1] - 30 - ci*40;
      timers.push(setTimeout(()=>{
        document.getElementById('ah').textContent = '';
        document.getElementById('ap').textContent = '';
        const lbl = document.createElementNS('http://www.w3.org/2000/svg','g');
        const code = c.member.split(' / ')[1], star = code.startsWith('*');
        let qn = null; const wq = x => { if (x.name.split(' / ')[1]===code && ('quota' in x) && !qn) qn = x; (x.children||[]).forEach(wq); }; wq(f.root);
        const qline = star && qn && qn.quota ? `quota ${fmt(qn.quota)} t · uptake ${(total(qn)/qn.quota*100).toFixed(2)} %` : '';
        // the condition's area appears as the vessel arrives: yellow for an asterisk code, blue otherwise
        if (false){
          const ob = outlineFor(new Set(STOCK_GEO[code] ? boxesFor(code).boxes : (AREA_SETS[code]||[])));
          if (ob){
            const area = document.createElementNS('http://www.w3.org/2000/svg','g'); area.setAttribute('data-area', code); area.setAttribute('opacity','0');
            const [ax0, ay0] = ob.bbox;
            area.innerHTML = `<path d="${ob['10']||ob['0']}" fill="${star?'#FFF1A6':'#E3ECF8'}" fill-opacity="0.85" stroke="${star?'#C99A06':'#2E5FA3'}" stroke-width="1.6" fill-rule="evenodd"/>
              <text x="${(ax0+20).toFixed(1)}" y="${Math.max(16, ay0+26).toFixed(1)}" font-size="13" font-weight="500" fill="${star?'#8A6A00':'#2E5FA3'}">${code} <tspan font-size="10" font-weight="400" fill="${star?'#6B5200':'#1E3F73'}">special condition</tspan></text>
              ${qline ? `<text x="${(ax0+20).toFixed(1)}" y="${Math.max(32, ay0+42).toFixed(1)}" font-size="11" font-weight="500" fill="#6B5200">${qline}</text>` : ''}`;
            g.insertBefore(area, trail);
            const tA = performance.now(); const fade = now => { const p = Math.min(1,(now-tA)/600); area.setAttribute('opacity', String(p)); if (p<1) requestAnimationFrame(fade); };
            if (reduced()) area.setAttribute('opacity','1'); else requestAnimationFrame(fade);
          }
        }
        const w = Math.max(150, (c.member.length+9)*6.2, qline.length*5.6+12) + (hasFish?34:0), h = qline ? 48 : 34;
        lbl.innerHTML = `<rect x="${to[0]+16}" y="${cardY-4}" width="${w}" height="${h}" rx="6" fill="${star?'#FFF6C7':'var(--paper)'}" fill-opacity="0.96" stroke="${star?'#C99A06':'var(--parent)'}" stroke-width="1"/>
          ${hasFish ? fishAt(sp, to[0]+32, cardY+13, sp==='LIN'?0.14:0.15, 'v'+st.area+ci, `${SPECIES[sp].name} (${SPECIES[sp].latin}) — ${c.member}`) : ''}
          <text x="${to[0]+22+(hasFish?34:0)}" y="${cardY+6}" dominant-baseline="central" font-size="11" font-weight="500" fill="${star?'#6B5200':'var(--parent-ink)'}">${c.member}</text>
          <text x="${to[0]+22+(hasFish?34:0)}" y="${cardY+19}" dominant-baseline="central" font-size="11" fill="${star?'#8A6A00':'var(--parent)'}">${fmt(tonnes)} t · ${st.area}</text>
          ${qline ? `<text x="${to[0]+22+(hasFish?34:0)}" y="${cardY+33}" dominant-baseline="central" font-size="10" font-weight="500" fill="#6B5200">${qline}</text>` : ''}`;
        g.insertBefore(lbl, boat);
        if (hasFish && !reduced()){
          const fz = document.createElementNS('http://www.w3.org/2000/svg','g');
          fz.innerHTML = fishAt(sp, 0, 0, 1, 'w'+st.area+ci, '', 1);
          g.insertBefore(fz, boat);
          const sx = to[0]-70, sy = to[1]+38, ex = to[0]-2, ey = to[1]-2, dur2 = 1300, t1 = performance.now();
          const step2 = now => { const p = Math.min(1,(now-t1)/dur2), e = ease(p);
            const x = sx+(ex-sx)*e, y = sy+(ey-sy)*e - Math.sin(p*Math.PI)*22, sc = 0.2*(1-e) + 0.03*e;
            fz.setAttribute('transform', `translate(${x},${y}) scale(${sc})`); fz.setAttribute('opacity', String(1 - Math.max(0,p-0.8)*5));
            if (p<1) requestAnimationFrame(step2); else fz.remove(); };
          requestAnimationFrame(step2);
        }
      }, t + 100));
      timers.push(setTimeout(()=>{
        const from0 = total; total += tonnes; caught.push({member:c.member, area:st.area, t:tonnes}); ledger();
        if (reduced()){ setHold(total); return; }
        const t2 = performance.now(), dur3 = 700;
        const step3 = now => { const p = Math.min(1,(now-t2)/dur3); setHold(from0 + (total-from0)*ease(p)); if (p<1) requestAnimationFrame(step3); };
        requestAnimationFrame(step3);
      }, t + 1400));
      t += 2400;
    });
    t += 300;
  }
}

// ===================== EXPLORER: any stock area on the map =====================
let exCode = '2AC4-C';
function renderExplorer(){
  timers.forEach(clearTimeout); timers = []; playing = false;
  document.body.dataset.view = 'explorer';
  const svg = document.getElementById('tree');
  svg.setAttribute('viewBox', `0 0 ${MAPW} ${MAPH}`);
  const e = STOCK_GEO[exCode]; const {boxes, outside} = boxesFor(exCode);
  document.getElementById('tt').textContent = `Stock area ${exCode}`;
  document.getElementById('td').textContent = e ? e.d : 'unknown code';
  const litSet = new Set(boxes);
  const o = outlineFor(litSet);
  const bx = ICES.map(([id,lab,a,b,c,d])=>`<rect x="${mx(a)}" y="${my(d)}" width="${(mx(c)-mx(a)).toFixed(1)}" height="${(my(b)-my(d)).toFixed(1)}" fill="#E6EEF2" fill-opacity="0.6" stroke="#B4C9D3" stroke-width="0.8" stroke-dasharray="3 3"/>`).join('')
    + (o ? `<path d="${o['0']}" fill="var(--parent-fill)" fill-opacity="0.95" stroke="var(--parent)" stroke-width="2" fill-rule="evenodd"/>` : '');
  const lb = ICES.map(([id,lab,a,b,c,d,lx,ly])=>{ const t=litSet.has(id);
    return `<text x="${mx(lx)}" y="${my(ly)}" text-anchor="middle" dominant-baseline="central" font-size="${t?15:12}" font-weight="${t?500:400}" fill="${t?'var(--parent)':'#7A8C96'}">${lab}</text>`; }).join('');
  const outsideTxt = outside.length ? `also: ${geoText(outside.map(o=>[o.t,o.c,o.j,o.k])).slice(0,140)}` : '';
  svg.innerHTML = svg.querySelector('title').outerHTML + svg.querySelector('desc').outerHTML + `
    <rect x="0" y="0" width="${MAPW}" height="${MAPH}" fill="#D3E1E7"/>${bx}
    <path d="${LAND_PATH}" fill="#F1EFE8" stroke="#B9AF9B" stroke-width="0.8" fill-rule="evenodd"/>${lb}
    <rect x="8" y="8" width="${Math.min(640, 40 + Math.max(exCode.length+10, outsideTxt.length)*6.4)}" height="${outsideTxt?46:28}" rx="6" fill="var(--paper)" fill-opacity="0.92" stroke="var(--rule)"/>
    <text x="18" y="22" dominant-baseline="central" font-size="14" font-weight="500" fill="var(--ink)">${exCode}</text>
    ${outsideTxt ? `<text x="18" y="42" dominant-baseline="central" font-size="11" fill="var(--ink-soft)">${outsideTxt}</text>` : ''}
    ${boxes.length===0 && e ? `<text x="${MAPW/2}" y="${MAPH/2}" text-anchor="middle" font-size="14" fill="var(--ink-soft)">nothing from this stock area lies inside this map window</text>` : ''}
    <text x="${MAPW-10}" y="${MAPH-10}" text-anchor="end" font-size="10" fill="#7A8C96">ICES divisions drawn schematically · coastline: Natural Earth</text>`;
  document.getElementById('subtitle').textContent = 'Any stock area in the database, decoded from the regulation text';
  document.getElementById('ah').textContent = exCode;
  document.getElementById('ap').textContent = e ? e.d : '';
  document.getElementById('ledger').innerHTML = e ? e.g.map(([t,c,j,k])=>`<div class="row in"><span>${geoText([[t,c,j,k]])}</span><span class="num">${t==='F'?'FAO':t==='E'?'EEZ':t==='R'?'RFMO':t==='G'?'GSA':t==='S'?'sandeel':t==='U'?'FU':t==='C'?'charter':'—'}</span></div>`).join('') : '';
  document.getElementById('note').textContent = 'Type a code in the box below, or use ↑ ↓ to step through the list.';
  document.getElementById('play').disabled = true;
  document.getElementById('hint').textContent = 'type a code · ↑ ↓ step · enter vessel';
}
const EX_CODES = Object.keys(STOCK_GEO);
function exStep(dir){ let i = EX_CODES.indexOf(exCode); i = (i + dir + EX_CODES.length) % EX_CODES.length; exCode = EX_CODES[i]; document.getElementById('exInput').value = exCode; renderExplorer(); }

function seg(id, items, get, set){
  const el = document.getElementById(id);
  el.innerHTML = items.map((it,i)=>`<button type="button" aria-pressed="${i===get()}">${it}</button>`).join('');
  el.querySelectorAll('button').forEach((b,i)=>b.addEventListener('click',()=>{ set(i); if (view==='map') renderMap(); else if (view==='species') renderSpecies(); else render(false); }));
}
seg('famSeg', FAMILIES.map(f=>`${f.country} ${f.name}`), ()=>fam, i=>fam=i);
seg('snapSeg', SNAPS.map(x=>x.label), ()=>snap, i=>snap=i);
document.getElementById('play').addEventListener('click', ()=> view==='cover' ? playBoarding() : view==='map' ? playVoyage() : play());
document.getElementById('exList').innerHTML = EX_CODES.map(c=>`<option value="${c}">`).join('');
document.getElementById('exInput').addEventListener('change', e=>{ const v=e.target.value.trim(); if (STOCK_GEO[v]) { exCode=v; renderExplorer(); } });
document.getElementById('exInput').addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); const v=e.target.value.trim().toUpperCase(); if (STOCK_GEO[v]) { exCode=v; e.target.value=v; renderExplorer(); } } e.stopPropagation(); });
document.getElementById('reset').addEventListener('click', ()=>render(false));
document.addEventListener('keydown', e=>{
  if (e.key==='Enter'){ e.preventDefault(); nextView(); return; }
  if (view==='cover'){ if (e.key===' '){ e.preventDefault(); playBoarding(); } return; }
  if (view==='species'){ if (e.key==='ArrowDown'){ fam=(fam+1)%FAMILIES.length; renderSpecies(); } else if (e.key==='ArrowUp'){ fam=(fam-1+FAMILIES.length)%FAMILIES.length; renderSpecies(); } return; }
  if (view==='map'){ if (e.key===' '){ e.preventDefault(); playVoyage(); } else if (e.key==='ArrowDown'){ fam=(fam+1)%FAMILIES.length; renderMap(); } else if (e.key==='ArrowUp'){ fam=(fam-1+FAMILIES.length)%FAMILIES.length; renderMap(); } return; }
  if (view==='explorer'){ if (document.activeElement && document.activeElement.id==='exInput') return; if (e.key==='ArrowDown') exStep(1); else if (e.key==='ArrowUp') exStep(-1); return; }
  if (e.key===' '){ e.preventDefault(); play(); }
  else if (e.key==='r' || e.key==='R'){ render(false); }
  else if (e.key==='ArrowRight'){ snap=Math.min(SNAPS.length-1,snap+1); render(false); }
  else if (e.key==='ArrowLeft'){ snap=Math.max(0,snap-1); render(false); }
  else if (e.key==='ArrowDown'){ fam=(fam+1)%FAMILIES.length; render(false); }
  else if (e.key==='ArrowUp'){ fam=(fam-1+FAMILIES.length)%FAMILIES.length; render(false); }
});
showCover(); renderTabs();
</script>
